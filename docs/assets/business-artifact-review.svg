<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" role="img" aria-labelledby="title desc"><title id="title">Evaluating an AI-generated business artifact</title><desc id="desc">A fictional retreat-planning task, document output mockup, and human review identify an omitted cost, unsupported booking claims, and an incomplete comparison.</desc><rect x="0" y="0" width="1200" height="780" rx="10" fill="#f7f5ed" stroke="#ccd8ce"/><text x="34" y="44" font-family="Arial,sans-serif" font-size="23" fill="#172e36">AI OUTPUT → HUMAN EVALUATION → USABILITY JUDGMENT</text><text x="34" y="77" font-family="Arial,sans-serif" font-size="16" fill="#172e36">Independent synthetic example · fictional destinations and costs · no client material</text><rect x="30" y="110" width="335" height="510" rx="10" fill="#e7eee6" stroke="#ccd8ce"/><text x="50" y="145" font-family="Arial,sans-serif" font-size="18" fill="#172e36">01 / ASSIGNED TASK</text><text x="50" y="187" font-family="Arial,sans-serif" font-size="17" fill="#172e36">Create a destination comparison</text><text x="50" y="218" font-family="Arial,sans-serif" font-size="17" fill="#172e36">for a six-person team retreat.</text><text x="50" y="249" font-family="Arial,sans-serif" font-size="17" fill="#172e36"></text><text x="50" y="280" font-family="Arial,sans-serif" font-size="17" fill="#172e36">Required:</text><text x="50" y="311" font-family="Arial,sans-serif" font-size="17" fill="#172e36">• Compare both options</text><text x="50" y="342" font-family="Arial,sans-serif" font-size="17" fill="#172e36">• Include all supplied costs</text><text x="50" y="373" font-family="Arial,sans-serif" font-size="17" fill="#172e36">• Stay within $2,400</text><text x="50" y="404" font-family="Arial,sans-serif" font-size="17" fill="#172e36">• Flag missing booking facts</text><text x="50" y="435" font-family="Arial,sans-serif" font-size="17" fill="#172e36"></text><text x="50" y="466" font-family="Arial,sans-serif" font-size="17" fill="#172e36">Audience: operations coordinator</text><rect x="385" y="110" width="395" height="510" rx="10" fill="#fffefa" stroke="#ccd8ce"/><text x="407" y="145" font-family="Arial,sans-serif" font-size="18" fill="#172e36">02 / AI-OUTPUT MOCKUP</text><rect x="407" y="170" width="350" height="102" rx="10" fill="#285f53" stroke="#ccd8ce"/><text x="428" y="211" font-family="Arial,sans-serif" font-size="27" fill="#fffefa">Your team retreat</text><text x="428" y="246" font-family="Arial,sans-serif" font-size="17" fill="#fffefa">Maple Harbor — our top choice</text><text x="425" y="311" font-family="Arial,sans-serif" font-size="17" fill="#172e36">Lodging                         $1,400</text><text x="425" y="349" font-family="Arial,sans-serif" font-size="17" fill="#172e36">Transport                          $200</text><text x="425" y="387" font-family="Arial,sans-serif" font-size="17" fill="#172e36">Meals                                $600</text><rect x="413" y="412" width="337" height="45" rx="10" fill="#edf1eb" stroke="#ccd8ce"/><text x="425" y="441" font-family="Arial,sans-serif" font-size="18" fill="#172e36">Total shown                    $2,200</text><text x="425" y="491" font-family="Arial,sans-serif" font-size="16" fill="#172e36">“Within budget.”</text><text x="425" y="522" font-family="Arial,sans-serif" font-size="16" fill="#172e36">“Accessible and ready to book.”</text><text x="425" y="553" font-family="Arial,sans-serif" font-size="16" fill="#172e36"></text><text x="425" y="584" font-family="Arial,sans-serif" font-size="16" fill="#172e36">Cedar Cove: a quiet alternative.</text><text x="408" y="597" font-family="Arial,sans-serif" font-size="13" fill="#172e36">Illustrative document excerpt, not a real file</text><rect x="800" y="110" width="370" height="510" rx="10" fill="#e7eee6" stroke="#ccd8ce"/><text x="821" y="145" font-family="Arial,sans-serif" font-size="18" fill="#172e36">03 / EVALUATOR FINDINGS</text><text x="821" y="190" font-family="Arial,sans-serif" font-size="16" fill="#172e36">1. Missing cost</text><text x="821" y="220" font-family="Arial,sans-serif" font-size="16" fill="#172e36">$400 meeting space omitted.</text><text x="821" y="250" font-family="Arial,sans-serif" font-size="16" fill="#172e36">Full total: $2,600 — over budget.</text><text x="821" y="280" font-family="Arial,sans-serif" font-size="16" fill="#172e36"></text><text x="821" y="310" font-family="Arial,sans-serif" font-size="16" fill="#172e36">2. Unsupported claim</text><text x="821" y="340" font-family="Arial,sans-serif" font-size="16" fill="#172e36">Accessibility and availability</text><text x="821" y="370" font-family="Arial,sans-serif" font-size="16" fill="#172e36">were not supplied.</text><text x="821" y="400" font-family="Arial,sans-serif" font-size="16" fill="#172e36"></text><text x="821" y="430" font-family="Arial,sans-serif" font-size="16" fill="#172e36">3. Incomplete comparison</text><text x="821" y="460" font-family="Arial,sans-serif" font-size="16" fill="#172e36">Cedar Cove total is absent.</text><text x="821" y="490" font-family="Arial,sans-serif" font-size="16" fill="#172e36"></text><text x="821" y="520" font-family="Arial,sans-serif" font-size="16" fill="#172e36">Strength: clear visual hierarchy.</text><rect x="30" y="642" width="1140" height="108" rx="10" fill="#172e36" stroke="#ccd8ce"/><text x="53" y="681" font-family="Arial,sans-serif" font-size="22" fill="#fffefa">JUDGMENT: NEEDS SUBSTANTIVE REVISION BEFORE USE</text><text x="53" y="718" font-family="Arial,sans-serif" font-size="18" fill="#fffefa">Clean presentation does not compensate for an incorrect recommendation or unsupported claims.</text></svg>